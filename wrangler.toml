name = "meeting-assistant"
main = "worker.js"
compatibility_date = "2026-08-22"

[vars]
PUBLIC_URL = "https://meeting-assistant.<your-subdomain>.workers.dev"
# "false" untuk publik tanpa auth (tidak disarankan). Di lokal, override lewat
# .dev.vars — tidak usah sentuh baris ini untuk dev sehari-hari.
AUTH_ENABLED = "true"

[assets]
directory = "./public"
binding = "ASSETS"
# Worker dipanggil dulu untuk SEMUA request (fail-fast konfigurasi auth +
# routing /api/*), asset statis diserve lewat env.ASSETS di akhir handler.
# Auth sendiri hanya diterapkan di route /api/* — shell frontend harus
# tetap termuat tanpa token (browser tak pernah kirim Authorization saat
# navigasi document). Token diisi lewat panel "Akses API" di UI.
run_worker_first = true

# Lockout auth (maks 3 percobaan gagal, reset otomatis 15 menit).
# Buat dulu: wrangler kv namespace create AUTH_KV — lalu tempel id-nya di bawah.
# Tanpa binding ini, auth tetap jalan tapi tanpa proteksi brute-force.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "<isi setelah menjalankan: wrangler kv namespace create AUTH_KV>"

# Secrets (jangan taruh di sini — pakai `wrangler secret put <NAMA>`):
#   OPENROUTER_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY, SAMBANOVA_API_KEY,
#   BASIC_AUTH_TOKEN
